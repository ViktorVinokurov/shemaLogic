services:
  backend:
    image: ${GHCR_IMAGE}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "false"
      SQLITE_PATH: /data/db.sqlite3
    volumes:
      - scheme-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/schemes/')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  web:
    image: ${GHCR_IMAGE}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  scheme-data:
